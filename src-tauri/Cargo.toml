[package]
name = "gdd-console"
version = "0.1.0"
description = "GDD 控制台 macOS 桌面壳（Tauri 2 + 系统 WKWebView）"
authors = ["GDD"]
edition = "2021"

[lib]
name = "gdd_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 原生错误对话框直接使用 AppKit NSAlert。不使用 tauri-plugin-dialog/rfd：
# - tauri-plugin-dialog 的 blocking_show 在“尚无可见窗口”时把 NSAlert 作为 sheet
#   挂到内部离屏窗口，用户看不到；
# - rfd 0.17 无父窗口时退化为 CFUserNotificationDisplayAlert（通知式、非应用窗口）。
# 直接 NSAlert::runModal 是应用级 modal，无窗口也可见（见 impl-ledger 修正记录）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tempfile = "3"
