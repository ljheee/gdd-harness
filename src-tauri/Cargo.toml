[package]
name = "gdd-console"
version = "0.1.0"
description = "GDD 控制台 macOS 桌面壳（Tauri 2 + 系统 WKWebView）"
authors = ["GDD"]
edition = "2021"

[lib]
name = "gdd_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
